<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Yarden Eshel</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F0F0F0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230A0A0A'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' fill='%23F5F2EE' text-anchor='middle'%3EYE%3C/text%3E%3C/svg%3E">
<style>
/* GitHub shows this page for any address that does not exist. It has no outside files, so it looks right at any depth. */
:root{--bg:#F0F0F0;--ink:#1C1A18;--soft:#4F4A46;--line:#D2D2D2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Source Serif 4',Georgia,serif;-webkit-font-smoothing:antialiased}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 16px}
.label{margin:0;color:var(--soft);font-weight:600;font-size:11px;letter-spacing:.5em;padding-left:.5em;text-transform:uppercase}
h1{margin:18px 0 12px;font-weight:300;font-size:clamp(40px,8vw,72px);letter-spacing:-.02em;line-height:1.1}
p{color:var(--soft);font-size:18px;line-height:1.7;margin:0 0 8px;max-width:40ch}
a.home{display:inline-block;margin-top:28px;padding:14px 4px;color:var(--ink);font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid currentColor}
a:hover{opacity:.72}
:focus-visible{outline:2px solid currentColor;outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="label">404</p>
  <h1>This page does not exist.</h1>
  <p>The address may be mistyped, or the page has moved.</p>
  <p lang="he" dir="rtl">העמוד לא נמצא. אולי הכתובת שגויה או שהעמוד הועבר.</p>
  <a class="home" id="home" href="/yarden-eshel/">Back to the portfolio</a>
</main>
<script>
// On github.io the site lives in a sub-folder (/yarden-eshel/). On a custom domain it lives at the root.
(function () {
  var a = document.getElementById('home');
  if (!/\.github\.io$/.test(location.hostname)) a.href = '/';
})();
</script>
</body>
</html>
